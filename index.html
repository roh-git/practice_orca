<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>포켓몬 가챠</title><link rel="stylesheet" href="styles.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script>
</head>
<body><main id="app">
  <div id="canvas-wrap" aria-label="클릭해서 열 수 있는 3D 몬스터볼"></div>
  <header><p>WHO'S THAT POKÉMON?</p><h1>포켓몬 가챠</h1><span><b id="ball-name">몬스터볼</b> · <span id="ball-description">야생 포켓몬을 잡기 위한 기본 볼</span></span></header>
  <ol id="steps"><li id="step-one" class="active"><b>01</b><span>몬스터볼을 선택하세요.</span></li><li id="step-two"><b>02</b><span>몬스터볼을 클릭하여<br>나의 스타팅 포켓몬을 뽑아보세요.</span></li></ol>
  <aside id="pokemon-info" aria-live="polite">
    <p class="result-label">GACHA RESULT</p><div class="result-number"><span id="pokemon-number">NO. ????</span><span id="pokemon-generation">?세대</span></div>
    <strong id="pokemon-name">WHO'S NEXT?</strong><div id="pokemon-types"></div>
    <dl><div><dt>HEIGHT</dt><dd id="pokemon-height">—</dd></div><div><dt>WEIGHT</dt><dd id="pokemon-weight">—</dd></div></dl>
    <p class="result-message">새로운 포켓몬을 만났어요!</p>
  </aside>
  <div id="draw-flash"></div>
  <p id="guide"><span>STEP 01</span>아래에서 몬스터볼을 선택하세요</p>
  <button id="close-button" type="button" hidden>다시 뽑기</button><p id="error" role="alert"></p>
  <nav id="ball-tabs" aria-label="몬스터볼 종류"></nav>
</main><script type="module" src="script.js"></script></body>
</html>
